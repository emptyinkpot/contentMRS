services:
  directus:
    image: directus/directus:11.5.1
    container_name: database-directus
    restart: unless-stopped
    ports:
      - "127.0.0.1:8055:8055"
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./uploads:/directus/uploads
      - ./extensions:/directus/extensions
