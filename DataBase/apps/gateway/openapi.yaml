openapi: 3.1.0
info:
  title: DataBase Gateway
  version: 0.1.0
  description: Thin API facade for the DataBase ecosystem.
servers:
  - url: http://127.0.0.1:18090
components:
  securitySchemes:
    DataBaseApiKey:
      type: apiKey
      in: header
      name: X-DataBase-Api-Key
      description: Optional. Required only when DATABASE_GATEWAY_AUTH_REQUIRED=true.
  schemas:
    RequestId:
      type: string
      description: Per-request correlation id returned in X-Request-Id.
    NullableDateTime:
      type:
        - string
        - "null"
      format: date-time
    ServiceIdentityResponse:
      type: object
      required:
        - service
        - version
        - docs
        - requestId
      properties:
        service:
          type: string
          const: database-gateway
        version:
          type: string
        docs:
          type: string
        requestId:
          $ref: "#/components/schemas/RequestId"
    HealthResponse:
      type: object
      properties:
        ok:
          type: boolean
        service:
          type: string
          const: database-gateway
        checks:
          type: object
          properties:
            mysql:
              type: string
          required:
            - mysql
          additionalProperties: false
        optionalDownstreams:
          type: object
          properties:
            nocodb:
              type: string
            openlist:
              type: string
            ragflow:
              type: string
          required:
            - nocodb
            - openlist
            - ragflow
          additionalProperties: false
        requestId:
          type: string
      required:
        - ok
        - service
        - checks
        - optionalDownstreams
        - requestId
      additionalProperties: false
    StatusResponse:
      type: object
      required:
        - ok
        - service
        - version
        - mode
        - bind
        - auth
        - downstream
        - contracts
        - requestId
      properties:
        ok:
          type: boolean
          const: true
        service:
          type: string
          const: database-gateway
        version:
          type: string
        mode:
          type: string
          const: read-write-facade
        bind:
          type: object
          required:
            - host
            - port
          properties:
            host:
              type: string
            port:
              type: integer
        auth:
          type: object
          required:
            - dataRoutes
            - header
            - required
          properties:
            dataRoutes:
              type: string
              enum:
                - none
                - api-key
            header:
              type: string
              const: X-DataBase-Api-Key
            required:
              type: boolean
        downstream:
          type: object
          required:
            - mysql
            - nocodbHealthUrl
            - openlistHealthConfigured
          properties:
            mysql:
              type: object
              required:
                - database
                - user
              properties:
                database:
                  type: string
                user:
                  type: string
            nocodbHealthUrl:
              type: string
            openlistHealthConfigured:
              type: boolean
        contracts:
          type: object
          required:
            - openapi
            - operations
          properties:
            openapi:
              type: string
            operations:
              type: string
        requestId:
          $ref: "#/components/schemas/RequestId"
    ErrorResponse:
      type: object
      required:
        - ok
        - error
        - message
      properties:
        ok:
          type: boolean
          const: false
        error:
          type: string
        message:
          type: string
        requestId:
          $ref: "#/components/schemas/RequestId"
    TableInventoryResponse:
      type: object
      required:
        - database
        - count
        - tables
        - requestId
      properties:
        database:
          type: string
        count:
          type: integer
        tables:
          type: array
          items:
            $ref: "#/components/schemas/TableInventoryItem"
        requestId:
          $ref: "#/components/schemas/RequestId"
    TableInventoryItem:
      type: object
      required:
        - name
        - visibility
        - approximateRows
        - dataBytes
        - updatedAt
      properties:
        name:
          type: string
        visibility:
          type: string
          enum:
            - allowed
            - hidden
        approximateRows:
          type:
            - integer
            - "null"
        dataBytes:
          type:
            - integer
            - "null"
        updatedAt:
          $ref: "#/components/schemas/NullableDateTime"
    Work:
      type: object
      required:
        - id
        - title
        - description_preview
        - status
        - platform
        - current_chapters
        - target_chapters
        - updated_at
        - created_at
      properties:
        id:
          oneOf:
            - type: integer
            - type: string
        title:
          type: string
        description_preview:
          type:
            - string
            - "null"
        status:
          type:
            - string
            - "null"
        platform:
          type:
            - string
            - "null"
        current_chapters:
          type:
            - integer
            - "null"
        target_chapters:
          type:
            - integer
            - "null"
        updated_at:
          $ref: "#/components/schemas/NullableDateTime"
        created_at:
          $ref: "#/components/schemas/NullableDateTime"
    WorksResponse:
      type: object
      required:
        - count
        - works
        - requestId
      properties:
        count:
          type: integer
        works:
          type: array
          items:
            $ref: "#/components/schemas/Work"
        requestId:
          $ref: "#/components/schemas/RequestId"
    Chapter:
      type: object
      required:
        - id
        - work_id
        - volume_number
        - chapter_number
        - title
        - word_count
        - status
        - audit_status
        - audit_issues
        - suggested_action
        - published_at
        - updated_at
        - created_at
      properties:
        id:
          oneOf:
            - type: integer
            - type: string
        work_id:
          oneOf:
            - type: integer
            - type: string
        volume_number:
          type:
            - integer
            - "null"
        chapter_number:
          type: integer
        title:
          type:
            - string
            - "null"
        word_count:
          type:
            - integer
            - "null"
        status:
          type:
            - string
            - "null"
        audit_status:
          type:
            - string
            - "null"
        audit_issues:
          type:
            - array
            - "null"
          items:
            type: object
            additionalProperties: true
        suggested_action:
          type:
            - string
            - "null"
        published_at:
          $ref: "#/components/schemas/NullableDateTime"
        updated_at:
          $ref: "#/components/schemas/NullableDateTime"
        created_at:
          $ref: "#/components/schemas/NullableDateTime"
    ChaptersResponse:
      type: object
      required:
        - workId
        - count
        - chapters
        - requestId
      properties:
        workId:
          type: string
        count:
          type: integer
        chapters:
          type: array
          items:
            $ref: "#/components/schemas/Chapter"
        requestId:
          $ref: "#/components/schemas/RequestId"
    CharactersResponse:
      type: object
      required:
        - workId
        - count
        - characters
        - requestId
      properties:
        workId:
          type: string
        count:
          type: integer
        characters:
          type: array
          items:
            type: object
            additionalProperties: true
        requestId:
          $ref: "#/components/schemas/RequestId"
    NotesResponse:
      type: object
      required:
        - count
        - notes
        - requestId
      properties:
        count:
          type: integer
        notes:
          type: array
          items:
            type: object
            additionalProperties: true
        requestId:
          $ref: "#/components/schemas/RequestId"
    ExperienceRecordsResponse:
      type: object
      required:
        - count
        - experienceRecords
        - requestId
      properties:
        count:
          type: integer
        experienceRecords:
          type: array
          items:
            type: object
            additionalProperties: true
        requestId:
          $ref: "#/components/schemas/RequestId"
    NoteResponse:
      type: object
      required:
        - note
        - requestId
      properties:
        note:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
        requestId:
          $ref: "#/components/schemas/RequestId"
    FanqieWorksResponse:
      type: object
      required:
        - count
        - fanqieWorks
        - requestId
      properties:
        count:
          type: integer
        fanqieWorks:
          type: array
          items:
            type: object
            additionalProperties: true
        requestId:
          $ref: "#/components/schemas/RequestId"
    LiteratureResponse:
      type: object
      required:
        - count
        - literature
        - requestId
      properties:
        count:
          type: integer
        literature:
          type: array
          items:
            type: object
            additionalProperties: true
        requestId:
          $ref: "#/components/schemas/RequestId"
    StateTransitionsResponse:
      type: object
      required:
        - count
        - transitions
        - requestId
      properties:
        count:
          type: integer
        transitions:
          type: array
          items:
            type: object
            additionalProperties: true
        requestId:
          $ref: "#/components/schemas/RequestId"
    CanonicalContentListResponse:
      type: object
      required:
        - count
        - requestId
      properties:
        count:
          type: integer
        works:
          type: array
          items:
            type: object
            additionalProperties: true
        parts:
          type: array
          items:
            type: object
            additionalProperties: true
        blocks:
          type: array
          items:
            type: object
            additionalProperties: true
        assets:
          type: array
          items:
            type: object
            additionalProperties: true
        publicationTargets:
          type: array
          items:
            type: object
            additionalProperties: true
        workId:
          type: string
        partId:
          type: string
        requestId:
          $ref: "#/components/schemas/RequestId"
    VocabularyItem:
      type: object
      required:
        - id
        - content
        - type
        - category
        - note
        - created_at
        - updated_at
      properties:
        id:
          oneOf:
            - type: integer
            - type: string
        content:
          type: string
        type:
          type: string
        category:
          type: string
        note:
          type:
            - string
            - "null"
        created_at:
          $ref: "#/components/schemas/NullableDateTime"
        updated_at:
          $ref: "#/components/schemas/NullableDateTime"
    VocabularySearchResponse:
      type: object
      required:
        - query
        - count
        - items
        - requestId
      properties:
        query:
          type: string
        count:
          type: integer
        items:
          type: array
          items:
            $ref: "#/components/schemas/VocabularyItem"
        requestId:
          $ref: "#/components/schemas/RequestId"
    CreativeWritingTechnique:
      type: object
      additionalProperties: true
      required:
        - id
        - name
        - layer
        - description
        - mechanism
        - suitable_for_json
        - prompt_instruction
        - quality_check
        - status
      properties:
        id:
          type: string
        name:
          type: string
        layer:
          type: string
        description:
          type: string
        mechanism:
          type: string
        suitable_for_json:
          type: array
          items:
            type: string
        avoid_when_json:
          type:
            - array
            - "null"
          items:
            type: string
        prompt_instruction:
          type: string
        quality_check:
          type: string
        status:
          type: string
    CreativeAuthorTechnique:
      type: object
      additionalProperties: true
      required:
        - author_profile_id
        - technique_id
        - weight
        - priority
        - task_types_json
        - trigger_text
        - constraint_text
        - status
      properties:
        author_profile_id:
          type: string
        technique_id:
          type: string
        weight:
          type: integer
        priority:
          type: string
        task_types_json:
          type: array
          items:
            type: string
        trigger_text:
          type: string
        constraint_text:
          type: string
        status:
          type: string
    CreativeStyleContractResponse:
      type: object
      properties:
        protocol:
          type: object
          properties:
            id:
              type: string
            name:
              type: string
            domain:
              type: string
            perspectiveRule:
              type: string
            toneRule:
              type: string
            executionRule:
              type: string
            payload:
              type: object
              properties:
                ideologicalBlend:
                  type: object
                  propertyNames:
                    type: string
                  additionalProperties:
                    type: number
                narrativeGoal:
                  type: string
                macroMicroLine:
                  type: string
                authorProfile:
                  type: object
                  properties:
                    id:
                      type: string
                    stance:
                      type: string
                    voice:
                      type: array
                      items:
                        type: string
                    narrativeTechniques:
                      type: array
                      items:
                        type: string
                    preferredDiction:
                      type: array
                      items:
                        type: string
                    rejectedDiction:
                      type: array
                      items:
                        type: string
                    qualityNorthStar:
                      type: string
                  required:
                    - id
                    - stance
                    - voice
                    - narrativeTechniques
                    - preferredDiction
                    - rejectedDiction
                    - qualityNorthStar
                  additionalProperties: false
                writingTaskTypes:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      goal:
                        type: string
                      requiredInputs:
                        type: array
                        items:
                          type: string
                      qualitySignals:
                        type: array
                        items:
                          type: string
                    required:
                      - id
                      - name
                      - goal
                      - requiredInputs
                      - qualitySignals
                    additionalProperties: false
                interestClusters:
                  type: array
                  items:
                    type: object
                    properties:
                      id:
                        type: string
                      name:
                        type: string
                      terms:
                        type: array
                        items:
                          type: string
                      appliesTo:
                        type: array
                        items:
                          type: string
                    required:
                      - id
                      - name
                      - terms
                      - appliesTo
                    additionalProperties: false
                lexiconLifecycle:
                  type: object
                  properties:
                    activeSource:
                      type: string
                    candidateSource:
                      type: string
                    promotionRule:
                      type: string
                    learningEvents:
                      type: string
                  required:
                    - activeSource
                    - candidateSource
                    - promotionRule
                    - learningEvents
                  additionalProperties: false
                conceptualEntry:
                  type: object
                  properties:
                    id:
                      type: string
                    name:
                      type: string
                    mechanism:
                      type: string
                    entrySources:
                      type: array
                      items:
                        type: string
                    forbiddenOpening:
                      type: string
                    preferredOpening:
                      type: string
                  required:
                    - id
                    - name
                    - mechanism
                    - entrySources
                    - forbiddenOpening
                    - preferredOpening
                  additionalProperties: false
                processPlan:
                  type: object
                  properties:
                    series:
                      type: string
                    episode:
                      type: string
                    timeBoundary:
                      type: string
                    viewpointBoundary:
                      type: string
                    knowledgeBoundary:
                      type: string
                    sceneEntrances:
                      type: array
                      items:
                        type: string
                    eventSequence:
                      type: array
                      items:
                        type: string
                    narrativeMoves:
                      type: array
                      items:
                        type: string
                    imageMotifs:
                      type: array
                      items:
                        type: string
                    pacingRules:
                      type: array
                      items:
                        type: string
                    dictionRules:
                      type: array
                      items:
                        type: string
                    forbiddenMoves:
                      type: array
                      items:
                        type: string
                    endingHook:
                      type: string
                    required:
                      type: boolean
                  additionalProperties: {}
                narrativeProtocol:
                  type: object
                  properties:
                    required:
                      type: boolean
                    perspective:
                      type: object
                      properties:
                        mode:
                          type: string
                        rules:
                          type: array
                          items:
                            type: string
                        prohibitions:
                          type: array
                          items:
                            type: string
                      additionalProperties: {}
                    ideologicalBlend:
                      type: array
                      items:
                        type: object
                        properties:
                          name:
                            type: string
                          ratio:
                            type: number
                          keywords:
                            type: array
                            items:
                              type: string
                        additionalProperties: {}
                    characterMotivationEngine:
                      type: array
                      items:
                        type: string
                    narrativeGoal:
                      type: string
                    narrativeDevices:
                      type: array
                      items:
                        type: string
                    persuasionStrategy:
                      type: array
                      items:
                        type: string
                    ironyMethods:
                      type: array
                      items:
                        type: string
                    structureLogic:
                      type: object
                      properties:
                        opening:
                          type: string
                        development:
                          type: string
                        ending:
                          type: string
                      additionalProperties: {}
                    lexicalSystem:
                      type: object
                      properties:
                        prioritySource:
                          type: string
                        preferredVocabulary:
                          type: array
                          items:
                            type: string
                        contextualVocabulary:
                          type: array
                          items:
                            type: object
                            propertyNames:
                              type: string
                            additionalProperties: {}
                        contextualRules:
                          type: array
                          items:
                            type: string
                        bannedTerms:
                          type: array
                          items:
                            type: string
                      additionalProperties: {}
                    rhetoricalSystem:
                      type: object
                      properties:
                        metaphorSources:
                          type: array
                          items:
                            type: string
                        metaphorStyle:
                          type: string
                        bannedMetaphors:
                          type: array
                          items:
                            type: string
                      additionalProperties: {}
                    sourceUse:
                      type: object
                      properties:
                        quotationSources:
                          type: array
                          items:
                            type: string
                        referenceAnchors:
                          type: array
                          items:
                            type: object
                            propertyNames:
                              type: string
                            additionalProperties: {}
                        citationRules:
                          type: array
                          items:
                            type: string
                      additionalProperties: {}
                    corePrinciples:
                      type: array
                      items:
                        type: string
                    formatProhibitions:
                      type: array
                      items:
                        type: string
                  additionalProperties: {}
                authorialConstitution:
                  type: object
                  properties:
                    coreLaw:
                      type: string
                    cannotDo:
                      type: array
                      items:
                        type: string
                    blockers:
                      type: array
                      items:
                        type: string
                  additionalProperties: {}
              additionalProperties: {}
          required:
            - id
            - name
            - domain
            - perspectiveRule
            - toneRule
            - executionRule
            - payload
          additionalProperties: false
        modules:
          type: array
          items:
            type: object
            properties:
              code:
                type: string
              parentCode:
                type: string
              category:
                type: string
              name:
                type: string
              moduleKind:
                type: string
              description:
                type: string
              payload: {}
            required:
              - code
              - parentCode
              - category
              - name
              - moduleKind
              - description
              - payload
            additionalProperties: false
        editingSteps:
          type: array
          items:
            type: object
            properties:
              stepOrder:
                type: number
              name:
                type: string
              taskSummary:
                type: string
              requiredReport: {}
              hardRules: {}
            required:
              - stepOrder
              - name
              - taskSummary
              - requiredReport
              - hardRules
            additionalProperties: false
        qualityRules:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              ruleType:
                type: string
              severity:
                type: string
              ruleText:
                type: string
              checkHint:
                type: string
            required:
              - id
              - ruleType
              - severity
              - ruleText
              - checkHint
            additionalProperties: false
        sourceMaterials:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              category:
                type: string
              title:
                type: string
              useCase:
                type: string
              payload: {}
            required:
              - id
              - category
              - title
              - useCase
              - payload
            additionalProperties: false
        techniques:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              layer:
                type: string
              description:
                type: string
              mechanism:
                type: string
              suitableFor:
                type: array
                items:
                  type: string
              avoidWhen:
                type: array
                items:
                  type: string
              promptInstruction:
                type: string
              qualityCheck:
                type: string
              status:
                type: string
            required:
              - id
              - name
              - layer
              - description
              - mechanism
              - suitableFor
              - avoidWhen
              - promptInstruction
              - qualityCheck
              - status
            additionalProperties: false
        authorTechniques:
          type: array
          items:
            type: object
            properties:
              authorProfileId:
                type: string
              techniqueId:
                type: string
              weight:
                type: number
              priority:
                type: string
              taskTypes:
                type: array
                items:
                  type: string
              trigger:
                type: string
              constraint:
                type: string
              status:
                type: string
            required:
              - authorProfileId
              - techniqueId
              - weight
              - priority
              - taskTypes
              - trigger
              - constraint
              - status
            additionalProperties: false
        lexicon:
          type: object
          properties:
            preferred:
              type: array
              items:
                type: object
                properties:
                  word:
                    type: string
                  content:
                    type: string
                  type:
                    type: string
                  category:
                    type: string
                  tags: {}
                  note:
                    type: string
                required:
                  - word
                  - content
                  - type
                  - category
                  - tags
                  - note
                additionalProperties: false
            banned:
              type: array
              items:
                type: object
                properties:
                  word:
                    type: string
                  content:
                    type: string
                  type:
                    type: string
                  category:
                    type: string
                  reason:
                    type: string
                  replacement:
                    type: string
                  alternative:
                    type: string
                required:
                  - word
                  - content
                  - type
                  - category
                  - reason
                  - replacement
                  - alternative
                additionalProperties: false
          required:
            - preferred
            - banned
          additionalProperties: false
        counts:
          type: object
          properties:
            modules:
              type: number
            editingSteps:
              type: number
            qualityRules:
              type: number
            sourceMaterials:
              type: number
            techniques:
              type: number
            authorTechniques:
              type: number
            preferredTerms:
              type: number
            bannedTerms:
              type: number
          required:
            - modules
            - editingSteps
            - qualityRules
            - sourceMaterials
            - techniques
            - authorTechniques
            - preferredTerms
            - bannedTerms
          additionalProperties: false
        requestId:
          type: string
      required:
        - protocol
        - modules
        - editingSteps
        - qualityRules
        - sourceMaterials
        - techniques
        - authorTechniques
        - lexicon
        - counts
        - requestId
      additionalProperties: false
    AuthorProfileResponse:
      type: object
      required:
        - profile
        - interestClusters
        - authorTechniques
        - counts
        - requestId
      properties:
        profile:
          type: object
          additionalProperties: true
        interestClusters:
          type: array
          items:
            type: object
            additionalProperties: true
        authorTechniques:
          type: array
          items:
            $ref: "#/components/schemas/CreativeAuthorTechnique"
        counts:
          type: object
          additionalProperties:
            type: integer
        requestId:
          $ref: "#/components/schemas/RequestId"
    SemanticUnit:
      type: object
      properties:
        id:
          type: string
        sourceId:
          anyOf:
            - type: string
            - type: "null"
        sourceTitle:
          type: string
        sourceAuthor:
          anyOf:
            - type: string
            - type: "null"
        sourceLocator:
          anyOf:
            - type: string
            - type: "null"
        excerpt:
          type: string
        summary:
          anyOf:
            - type: string
            - type: "null"
        materialKind:
          oneOf:
            - type: string
              enum:
                - document
                - theory
                - comparison
                - observer
                - literary
            - type: "null"
