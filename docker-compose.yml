services:
  database-gateway:
    build:
      context: ./DataBase
      dockerfile: Dockerfile.gateway
    ports:
      - "18090:18090"
    env_file: .env
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:18090/').then(r=>{if(!r.ok)throw 1})"]
      interval: 30s
      timeout: 5s
      retries: 3

  contentbase:
    build:
      context: ./ContentBase
      dockerfile: Dockerfile
    ports:
      - "5111:5111"
    env_file: .env
    mem_limit: 512m
    restart: unless-stopped
    depends_on:
      database-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5111/').then(r=>{if(!r.ok)throw 1})"]
      interval: 30s
      timeout: 5s
      retries: 3
